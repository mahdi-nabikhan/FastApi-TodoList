services:
  db:
    image: postgres:15-alpine
    container_name: fastapi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  todo-backend:
    build:
      context: .
      dockerfile: Dockerfile.Backend
    container_name: todo-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/src  
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres123@db:5432/postgres
      SECRET_KEY: z_f%#7x&0!n6uuamyca%y5swv1(9e=u=wu9s#wy(3f-k__k777